[project]
name = "typesafe-jev-examples"
version = "0.1.0"
description = "Worked examples for TypeSafe's Jev System One model, runnable today through OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajiv" }]
keywords = ["typesafe", "jev", "system-one", "openrouter", "classification", "routing"]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "live: sends a real request to Jev over the network; needs a key",
]
